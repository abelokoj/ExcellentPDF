# Fuzz targets (plan K.3, K.23, §16), run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run --fuzz-dir tests/fuzz open_render
#   cargo +nightly fuzz run --fuzz-dir tests/fuzz parse_limits
#   cargo +nightly fuzz run --fuzz-dir tests/fuzz annot_save
# A workspace of its own, as cargo-fuzz requires, so its dev/fuzz dependencies stay isolated from the shipping build.
[package]
name = "excellent-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
excellent-core = { path = "../../crates/excellent-core" }
excellent-mupdf = { path = "../../crates/excellent-mupdf" }

[[bin]]
name = "open_render"
path = "fuzz_targets/open_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_limits"
path = "fuzz_targets/parse_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annot_save"
path = "fuzz_targets/annot_save.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
