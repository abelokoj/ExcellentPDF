[package]
name = "excellent-mupdf-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Raw bindings and C shims for SumatraPDF's MuPDF 1.28.5 tree"
links = "mupdf"
build = "build.rs"

[features]
# Rewrites src/bindings.rs from csrc/shim.h with bindgen (needs libclang). Off for normal builds.
regenerate-bindings = ["dep:bindgen"]

[build-dependencies]
cc.workspace = true
bindgen = { workspace = true, optional = true }

[lints]
workspace = true
