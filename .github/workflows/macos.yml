# macOS: built and tested on every push to main and every pull request since Phase 2 (plan §18,
# dev notes/dev_decisions.md, DD2). Each job uploads the release binary as an artifact.
name: macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    uses: ./.github/workflows/build.yml
    with:
      name: macos-arm64
      runner: macos-15
      target: aarch64-apple-darwin
      test: true
      package: true

  x64:
    uses: ./.github/workflows/build.yml
    with:
      name: macos-x64
      runner: macos-15-intel
      target: x86_64-apple-darwin
      test: true
      package: true
