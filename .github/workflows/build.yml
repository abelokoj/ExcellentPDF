# Reusable job: builds the workspace for one Rust target and, where the runner can run it, tests it.
# The per-platform workflows (windows.yml, linux.yml, macos.yml, android.yml, ios.yml) call it.
# See dev notes/dev_decisions.md (DD2).
name: build

on:
  workflow_call:
    inputs:
      name:
        description: Job name shown in the checks list
        type: string
        required: true
      runner:
        description: GitHub-hosted runner image
        type: string
        required: true
      target:
        description: Rust target triple
        type: string
        required: true
      test:
        description: Run the tests (only where the runner can execute the target)
        type: boolean
        default: false
      clippy:
        description: Run clippy with warnings as errors
        type: boolean
        default: false
      package:
        description: Build the release app and upload it as an artifact (desktop targets)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables only: backtraces keep their lines, and linking the app's test binaries fits the runners' memory (the
  # Linux arm64 runner was shut down while linking with full debug info).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup toolchain install
          rustup target add ${{ inputs.target }}

      # libjpeg-turbo's SIMD code; without NASM it builds its slower C code.
      - name: NASM
        if: startsWith(inputs.target, 'x86_64') || startsWith(inputs.target, 'i686')
        uses: ilammy/setup-nasm@v1

      # fontconfig for system fonts, OpenSSL for PDF signatures and encrypted ZIP entries, GTK 4 and GStreamer for
      # NSH's Linux backend (nsh-platform-linux).
      - name: Linux libraries
        if: contains(inputs.target, 'linux-gnu')
        run: >-
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libssl-dev libgtk-4-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: cargo-ndk
        if: contains(inputs.target, 'android')
        run: cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.target }}

      - name: Clippy
        if: inputs.clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ inputs.target }} -- -D warnings

      # Android API level 28: the first with iconv, which libarchive uses for file names.
      - name: Build
        run: |
          if [[ "${{ inputs.target }}" == *android* ]]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            cargo ndk --target ${{ inputs.target }} --platform 28 build --workspace --all-targets --locked
          else
            cargo build --workspace --all-targets --locked --target ${{ inputs.target }}
          fi

      - name: Test
        if: inputs.test
        run: cargo test --workspace --locked --no-fail-fast --target ${{ inputs.target }}

      # A test build, not a release: N is 0 in the name (dev_decisions.md, DD3). The installers (a .app bundle, a
      # package for Linux) come with their platforms' packaging work; until then the binary is archived.
      - name: Package
        if: inputs.package
        run: |
          cargo build --release --locked -p ecclesia-app --target ${{ inputs.target }}
          version=$(cargo pkgid -p ecclesia-app | sed 's/.*[#@]//')
          name="EcclesiaPDF-v$(date +%y-%m-%d).0-v$version-${{ inputs.name }}"
          mkdir -p "dist/$name"
          cp target/${{ inputs.target }}/release/ecclesiapdf "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      - name: Upload
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}.tar.gz
          retention-days: 14
