# Linux: ready, but run by hand only until Phase 2 (plan §18). To build it on every change, copy the `push` and
# `pull_request` triggers from windows.yml (dev notes/dev_decisions.md, DD2).
name: linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x64:
    uses: ./.github/workflows/build.yml
    with:
      name: linux-x64
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      test: true

  arm64:
    uses: ./.github/workflows/build.yml
    with:
      name: linux-arm64
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      test: true
