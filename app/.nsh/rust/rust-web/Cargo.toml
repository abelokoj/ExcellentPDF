[package]
name = "nsh-app-ecclesia-app-rust-web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "nsh_app_ecclesia_app_rust_web"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
# What `nsh package` links the app's runtime from (its relocations kept).
linkable = ["nsh-platform-web/linkable"]

[dependencies]
nsh-core = { version = "=0.7.0" }
nsh-base = { version = "=0.7.0", features = ["highlight"] }
app_ecclesia_app = { package = "ecclesia-app", path = "C:\\dev\\EcclesiaPDF\\crates\\ecclesia-app" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nsh-platform-web = { version = "=0.7.0", default-features = false, features = ["rust-parts"] }
