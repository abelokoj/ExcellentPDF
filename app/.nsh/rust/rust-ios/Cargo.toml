[package]
name = "nsh-app-ecclesia-app-rust-ios"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-ecclesia-app-rust-ios"
path = "main.rs"

[dependencies]
nsh-ios-app = { version = "=0.7.0", default-features = false }
nsh-core = { version = "=0.7.0" }
nsh-base = { version = "=0.7.0", features = ["highlight"] }
app_ecclesia_app = { package = "ecclesia-app", path = "C:\\dev\\EcclesiaPDF\\crates\\ecclesia-app" }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "=0.7.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }
