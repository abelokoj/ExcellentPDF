[package]
name = "nsh-app-ecclesia-app-rust-android"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "nsh_app_ecclesia_app_rust_android"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
nsh-core = { version = "=0.7.0" }
nsh-base = { version = "=0.7.0", features = ["highlight"] }
app_ecclesia_app = { package = "ecclesia-app", path = "C:\\dev\\EcclesiaPDF\\crates\\ecclesia-app" }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.7.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }
