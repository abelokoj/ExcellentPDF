[package]
name = "nsh-app-excellent-app-rust-android"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "nsh_app_excellent_app_rust_android"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
nsh-core = { version = "=0.5.0" }
nsh-base = { version = "=0.5.0", features = ["highlight"] }
app_excellent_app = { package = "excellent-app", path = "C:\\dev\\ExcellentPDF\\crates\\excellent-app" }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
