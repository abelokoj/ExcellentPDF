[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/abelokoj/ExcellentPDF"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"

# Every dependency is declared here once; crates use `name.workspace = true`.
[workspace.dependencies]
# Build tools
cc = { version = "1.2", features = ["parallel"] }
bindgen = "0.73"

# UI: NSH, pinned to the installed CLI's version (AGENTS D2). No default features: we use NSH's Rust components
# only, so neither QuickJS nor the optional components (editor, plots, terminal, ...) are built in.
nsh-core = "=0.5.0"
nsh-base = { version = "=0.5.0", default-features = false }
nsh-platform-windows = { version = "=0.5.0", default-features = false }
nsh-platform-macos = { version = "=0.5.0", default-features = false }
nsh-platform-linux = { version = "=0.5.0", default-features = false }
nsh-engine = { version = "=0.5.0", default-features = false }
nsh-testing = { version = "=0.5.0", default-features = false }
# The macOS page canvas (K.9): the AppKit, Core Graphics and dispatch crates NSH's macOS backend already uses, at
# its versions, with the parts the canvas calls.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSAccessibility",
  "NSAccessibilityConstants",
  "NSAccessibilityProtocols",
  "NSCursor",
  "NSEvent",
  "NSGraphicsContext",
  "NSPrintInfo",
  "NSPrintPanel",
  "NSResponder",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSRange", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGImage",
  "CGPath",
] }
dispatch2 = "0.3.1"
# Print spools on macOS and Linux (O.22): already in the tree through NSH.
flate2 = "1"
env_logger = "0.11"
log = "0.4"
# Theme and settings files (K.17, K.16). serde_json is NSH's already.
serde_json = "1"
toml = "1"
# The library database (K.20, D7). Bundled: one SQLite on every platform, with FTS5. `fallible_uint`: positions
# and counts are stored from `usize`.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
# Property tests (plan K.6). No default features: no forking test runner.
proptest = { version = "1", default-features = false, features = ["std"] }
# Win32 for the page canvas (D5): the version NSH 0.5.0 uses, so one copy is built.
windows = { version = "0.62", features = [
    "std",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` for the canvas's UI Automation providers (U.2) names this crate.
windows-core = "0.62"
windows-numerics = { version = "0.3", default-features = false }

# Our crates
excellent-mupdf-sys = { path = "crates/excellent-mupdf-sys" }
excellent-mupdf = { path = "crates/excellent-mupdf" }
excellent-core = { path = "crates/excellent-core" }
excellent-canvas = { path = "crates/excellent-canvas" }
excellent-canvas-win = { path = "crates/excellent-canvas-win" }
excellent-canvas-mac = { path = "crates/excellent-canvas-mac" }
excellent-canvas-gtk = { path = "crates/excellent-canvas-gtk" }
excellent-canvas-ios = { path = "crates/excellent-canvas-ios" }
excellent-canvas-android = { path = "crates/excellent-canvas-android" }
excellent-ink = { path = "crates/excellent-ink" }
excellent-text = { path = "crates/excellent-text" }
excellent-store = { path = "crates/excellent-store" }
excellent-platform = { path = "crates/excellent-platform" }
excellent-packs = { path = "crates/excellent-packs" }
excellent-ai = { path = "crates/excellent-ai" }
excellent-features = { path = "crates/excellent-features" }
excellent-app = { path = "crates/excellent-app" }
excellent-cli = { path = "crates/excellent-cli" }

# Shipping builds (T10): smaller and faster code. Panics stay `unwind`: NSH catches a component's panic
# (`catch_unwind` in nsh-core) so one broken view doesn't take the window down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
